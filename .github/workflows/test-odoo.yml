name: Odoo 19

on:
  push:
    branches: ['19.0', 'codex/**']
  pull_request:
    branches: ['19.0']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: addons/orden_trabajo
      - name: Install and test on Odoo 19
        run: |
          docker run --rm --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo -d orden_trabajo_test \
            --init=orden_trabajo --without-demo \
            --test-enable --test-tags=/orden_trabajo \
            --stop-after-init --no-http --workers=0
      - name: Update and test on Odoo 19
        run: |
          docker run --rm --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo -d orden_trabajo_test \
            --update=orden_trabajo --without-demo \
            --test-enable --test-tags=/orden_trabajo \
            --stop-after-init --no-http --workers=0
      - uses: actions/checkout@v5
        with:
          ref: 94c11ab77e7db1fc2031b1da3e364959b52b9370
          path: previous-addons/orden_trabajo
      - name: Install the previous project adaptation
        run: |
          docker run --rm --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/previous-addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo -d orden_trabajo_upgrade \
            --init=orden_trabajo --without-demo --stop-after-init --no-http
          docker run --rm -i --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/previous-addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo shell -d orden_trabajo_upgrade --no-http \
            < "$GITHUB_WORKSPACE/addons/orden_trabajo/.github/scripts/seed_upgrade.py"
      - name: Migrate existing project data to standalone order support
        run: |
          docker run --rm --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo -d orden_trabajo_upgrade \
            --update=orden_trabajo --without-demo --stop-after-init --no-http
          docker run --rm -i --network host \
            -v orden_trabajo_data:/var/lib/odoo \
            -e HOST=127.0.0.1 -e PASSWORD=odoo \
            -v "$GITHUB_WORKSPACE/addons:/mnt/extra-addons:ro" \
            odoo:19.0 odoo shell -d orden_trabajo_upgrade --no-http \
            < "$GITHUB_WORKSPACE/addons/orden_trabajo/.github/scripts/check_upgrade.py"
